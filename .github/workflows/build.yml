# Сборка при каждом изменении в ветке main:
#   web — публикация веб-версии на GitHub Pages (ставится на Android из Chrome);
#   apk — сборка APK-файла из того же кода (Capacitor), скачивается из раздела Actions.
name: Сборка

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Сборка веб-версии
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Сборка веб-версии
        run: python3 build.py
      - name: Зависимости Capacitor
        run: npm install
      - name: Android-проект
        run: npx cap add android
      - name: Разрешение на камеру (фото керна)
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml
      - name: Копирование веб-версии в Android-проект
        run: npx cap sync android
      - name: Сборка APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kern-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
